version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: startrack-minio
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - startrack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: startrack-backend
    ports:
      - "5000:5000"
    environment:
      - NASA_API_KEY=${NASA_API_KEY:-DEMO_KEY}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-apod-cache}
      - FLASK_ENV=production
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - startrack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: startrack-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - startrack-network

networks:
  startrack-network:
    driver: bridge

volumes:
  minio_data:
